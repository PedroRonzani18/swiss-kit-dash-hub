services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: swisskit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d swisskit_test']
      interval: 2s
      timeout: 5s
      retries: 30
